<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Máy tính đơn giản</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Máy tính">
    <div class="screen" aria-live="polite">
      <div id="history" class="history"></div>
      <div id="display" class="display">0</div>
    </div>
    <div class="keys" id="keys">
      <button data-action="clear" class="fn">C</button>
      <button data-action="back" class="fn" aria-label="Xóa một ký tự">⌫</button>
      <button data-action="sign" class="fn" aria-label="Đổi dấu">±</button>
      <button data-op="/" class="op" aria-label="Chia">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button data-op="*" class="op" aria-label="Nhân">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button data-op="-" class="op" aria-label="Trừ">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button data-op="+" class="op" aria-label="Cộng">+</button>

      <button data-digit="0" class="zero">0</button>
      <button data-digit=".">.</button>
      <button data-action="equals" class="eq" aria-label="Bằng">=</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
